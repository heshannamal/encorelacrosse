name: Validate Shop Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/ShopController.php'
      - 'routes/ecommerce.php'
      - '.github/workflows/validate-shop-pages.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: php -l app/Http/Controllers/ShopController.php
      - run: php -l routes/ecommerce.php
