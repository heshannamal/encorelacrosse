name: Validate Instagram Temp
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-instagram-temp.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENCORE_API_TOKEN: test-token
      INSTAGRAM_USERNAME: encorelacrosse
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer update laravel/socialite --with-all-dependencies --no-interaction --no-progress
      - run: php -l app/Http/Controllers/InstagramFeedController.php
      - run: php -l app/Models/InstagramAccount.php
      - run: php -l app/Console/Commands/RefreshInstagramToken.php
      - run: php -l app/Console/Commands/RepairInstagramToken.php
      - run: php -l database/migrations/2026_09_18_120500_create_instagram_accounts_table.php
      - run: php -l config/services.php
      - run: php -l routes/web.php
      - run: php artisan route:list
      - run: php artisan list | grep -E 'instagram:(refresh-token|repair-token)'
      - run: php artisan view:clear
      - run: php artisan view:cache
