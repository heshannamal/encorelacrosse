name: Localize Services Carousel Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-services-carousel-assets.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download service carousel images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/services-carousel

          curl --fail --location --retry 3 \
            "https://ucarecdn.com/2f7356f7-c7c9-4cc1-8f32-086f0abae371/-/preview/1600x1600/-/format/jpeg/-/quality/normal/Design%20copy.jpg" \
            -o public/images/services-carousel/custom-graphic-design.jpg

          curl --fail --location --retry 3 \
            "https://ucarecdn.com/c056f0f4-44a5-40cc-baed-1d6a21112240/-/preview/1600x1600/-/format/jpeg/-/quality/normal/Shop%20copy.jpg" \
            -o public/images/services-carousel/shop-lifestyle-apparel.jpg

          curl --fail --location --retry 3 \
            "https://ucarecdn.com/4697da7c-58b1-43f8-a6c6-57fd05969643/-/preview/1600x1600/-/format/jpeg/-/quality/normal/TeamSore%20copy.jpg" \
            -o public/images/services-carousel/team-store-delivery.jpg

          curl --fail --location --retry 3 \
            "https://ucarecdn.com/77f7b45b-f59f-4630-b76c-015b5b870df6/-/preview/1600x1600/-/format/jpeg/-/quality/normal/Embellishment2.jpg" \
            -o public/images/services-carousel/embellishment-types.jpg

          curl --fail --location --retry 3 \
            "https://ucarecdn.com/28983e22-f786-4144-8727-5038bb424dc3/-/preview/1600x1600/-/format/jpeg/-/quality/normal/Sizing%20copy.jpg" \
            -o public/images/services-carousel/sizing-guidelines.jpg

          curl --fail --location --retry 3 \
            "https://ucarecdn.com/f452a03f-1922-4ce0-a4a3-5353d40976be/-/preview/1600x1600/-/format/jpeg/-/quality/normal/Fabric%20copy.jpg" \
            -o public/images/services-carousel/fabrics.jpg

          file public/images/services-carousel/*

      - name: Replace CDN URLs with local Laravel assets
        shell: python
        run: |
          from pathlib import Path

          path = Path("resources/views/components/servicesCarousel.blade.php")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "https://ucarecdn.com/2f7356f7-c7c9-4cc1-8f32-086f0abae371/-/format/auto/-/preview/3000x3000/-/quality/lighter/Design%20copy.jpg":
                  "{{ asset('images/services-carousel/custom-graphic-design.jpg') }}",
              "https://ucarecdn.com/c056f0f4-44a5-40cc-baed-1d6a21112240/-/format/auto/-/preview/3000x3000/-/quality/lighter/Shop%20copy.jpg":
                  "{{ asset('images/services-carousel/shop-lifestyle-apparel.jpg') }}",
              "https://ucarecdn.com/4697da7c-58b1-43f8-a6c6-57fd05969643/-/format/auto/-/preview/3000x3000/-/quality/lighter/TeamSore%20copy.jpg":
                  "{{ asset('images/services-carousel/team-store-delivery.jpg') }}",
              "https://ucarecdn.com/77f7b45b-f59f-4630-b76c-015b5b870df6/-/format/auto/-/preview/3000x3000/-/quality/lighter/Embellishment2.jpg":
                  "{{ asset('images/services-carousel/embellishment-types.jpg') }}",
              "https://ucarecdn.com/28983e22-f786-4144-8727-5038bb424dc3/-/format/auto/-/preview/3000x3000/-/quality/lighter/Sizing%20copy.jpg":
                  "{{ asset('images/services-carousel/sizing-guidelines.jpg') }}",
              "https://ucarecdn.com/f452a03f-1922-4ce0-a4a3-5353d40976be/-/format/auto/-/preview/3000x3000/-/quality/lighter/Fabric%20copy.jpg":
                  "{{ asset('images/services-carousel/fabrics.jpg') }}",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected CDN URL not found: {old}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/services-carousel resources/views/components/servicesCarousel.blade.php
          git commit -m "Localize services carousel assets"
          git push origin HEAD:main
