name: Validate Shop Nav Temp
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-shop-nav-temp.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENCORE_API_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer update laravel/socialite --with-all-dependencies --no-interaction --no-progress
      - run: php -l routes/ecommerce.php
      - run: php -l app/Http/Controllers/StorefrontController.php
      - run: php artisan route:list
      - run: php artisan view:clear
      - run: php artisan view:cache
