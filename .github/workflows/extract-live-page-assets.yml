name: Extract Live Teamwear Page Assets

on:
  push:
    paths:
      - '.github/workflows/extract-live-page-assets.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch live pages and extract image URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/asset-manifests .tmp/html
          pages=(
            'womens-shorts-and-kilts'
            'womens-shooter-shirts'
            'outerwear'
            'hoodies'
            'joggers-and-sweatpants'
            'lpp'
          )
          for slug in "${pages[@]}"; do
            curl -L --fail --retry 3 -A 'Mozilla/5.0' "https://encorelacrosse.com/pages/${slug}" -o ".tmp/html/${slug}.html"
          done
          python3 - <<'PY'
          import re, html, pathlib
          root = pathlib.Path('.tmp/html')
          out = pathlib.Path('.tmp/asset-manifests')
          for p in root.glob('*.html'):
              text = html.unescape(p.read_text(errors='ignore'))
              urls = []
              patterns = [
                  r'https://(?:ucarecdn\.com|encorelacrosse\.com|cdn\.shopify\.com)[^"\'<> )]+',
                  r'//cdn\.shopify\.com[^"\'<> )]+',
                  r'/cdn/shop/files/[^"\'<> )]+',
              ]
              for pat in patterns:
                  for m in re.findall(pat, text):
                      u = m.replace('\\u0026', '&').replace('&amp;', '&')
                      if u.startswith('//'):
                          u = 'https:' + u
                      elif u.startswith('/cdn/'):
                          u = 'https://encorelacrosse.com' + u
                      if any(ext in u.lower() for ext in ['.jpg', '.jpeg', '.png', '.webp', '.avif', 'ucarecdn.com']):
                          if u not in urls:
                              urls.append(u)
              (out / f'{p.stem}.txt').write_text('\n'.join(f'{i+1:03d} {u}' for i,u in enumerate(urls)))
          PY
      - name: Commit manifests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/asset-manifests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract live Teamwear page asset manifests'
          git push
