name: Download Actual Teamwear Assets

on:
  push:
    paths:
      - '.github/workflows/download-actual-teamwear-assets.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact live Encore assets
        shell: bash
        run: |
          set -euo pipefail
          dl() {
            local url="$1"
            local path="$2"
            mkdir -p "$(dirname "$path")"
            echo "Downloading $path"
            curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o "$path"
          }

