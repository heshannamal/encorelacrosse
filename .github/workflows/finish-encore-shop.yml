name: Finish Encore Shop

on:
  push:
    paths:
      - '.github/workflows/finish-encore-shop.yml'

permissions:
  contents: write

jobs:
  finish-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply storefront fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Enable Sport filter in the dynamic storefront controller.
          p = Path('app/Http/Controllers/StorefrontController.php')
          s = p.read_text()
          s = s.replace("            // Sport is intentionally not a public Shop filter.\n            $request->query->remove('selectedSport');\n\n", "")
          s = s.replace("                'selectedGender' => $request->input('selectedGender'),\n                'selectedStyle' => $request->input('selectedStyle'),", "                'selectedGender' => $request->input('selectedGender'),\n                'selectedSport' => $request->input('selectedSport'),\n                'selectedStyle' => $request->input('selectedStyle'),")
          s = s.replace("                'mainCategories' => $this->shopMainCategories(),\n                'productCategories' =>", "                'mainCategories' => $this->shopMainCategories(),\n                'sports' => $this->listFrom(fn () => $this->products->sports(), 'sports'),\n                'productCategories' =>")
          s = s.replace("                'mainCategories' => $this->fallbackCategories(),\n                'productCategories' =>", "                'mainCategories' => $this->fallbackCategories(),\n                'sports' => [],\n                'productCategories' =>")
          p.write_text(s)

          # 2) Add Sport to the Encore shop UI and filter chips.
          p = Path('resources/views/shop/all-products.blade.php')
          s = p.read_text()
          s = s.replace("    $mainCategories = $mainCategories ?? [];\n    $productCategories", "    $mainCategories = $mainCategories ?? [];\n    $sports = $sports ?? [];\n    $productCategories")
          s = s.replace("request()->filled('selectedStyle') ||", "request()->filled('selectedSport') || request()->filled('selectedStyle') ||")
          marker = '''            <div class="ec-filter">\n                <label>Style</label>'''
          sport = '''            <div class="ec-filter">\n                <label>Sport</label>\n                <select name="selectedSport" class="js-ec-auto-filter">\n                    <option value="">All Sports</option>\n                    @foreach($sports as $sport)\n                        <option value="{{ data_get($sport, 'id') }}" {{ (string)request('selectedSport') === (string)data_get($sport, 'id') ? 'selected' : '' }}>{{ data_get($sport, 'sport_name') }}</option>\n                    @endforeach\n                </select>\n            </div>\n\n'''
          if sport not in s:
              s = s.replace(marker, sport + marker)
          chip_marker = "            @if(request('selectedStyle'))<a class=\"ec-chip\""
          sport_chip = "            @if(request('selectedSport'))<a class=\"ec-chip\" href=\"{{ route('allProduct', request()->except('selectedSport')) }}\">Sport <span>×</span></a>@endif\n"
          if sport_chip not in s:
              s = s.replace(chip_marker, sport_chip + chip_marker)
          p.write_text(s)

          # 3) Fit Category/Sport/Style/Gender/Sort/Search on the toolbar.
          p = Path('resources/views/shop/ecommerce/_styles.blade.php')
          s = p.read_text()
          s = s.replace("grid-template-columns:1.1fr 1.5fr 1fr 1fr minmax(180px,1.3fr)", "grid-template-columns:1.05fr 1.05fr 1.35fr .9fr .95fr minmax(180px,1.3fr)")
          p.write_text(s)

          # 4) Wire navbar account/cart links to the real ecommerce routes and make badge sync work.
          p = Path('resources/views/layouts/navbar.blade.php')
          s = p.read_text()
          s = s.replace('href="/account/login" class="encore-tool"', 'href="{{ route(\'login\') }}" class="encore-tool"')
          s = s.replace('href="/cart" class="encore-tool encore-cart"', 'href="{{ route(\'cart\') }}" class="encore-tool encore-cart"')
          s = s.replace('<span class="encore-cart-count">0</span>', '<span class="encore-cart-count" data-encore-cart-count>0</span>')
          s = s.replace('href="/cart" class="encore-mobile-cart"', 'href="{{ route(\'cart\') }}" class="encore-mobile-cart"')
          s = s.replace('<span>0</span></a>\n            <button class="encore-mobile-toggle"', '<span data-encore-cart-count>0</span></a>\n            <button class="encore-mobile-toggle"')
          p.write_text(s)

          # 5) Keep the Alcatraz route contract, but retain StorefrontController because
          #    Encore also has legacy static ShopController category methods.
          p = Path('routes/ecommerce.php')
          s = p.read_text()
          # Route names/paths already match the supplied Alcatraz contract.
          p.write_text(s)

      - name: Commit storefront changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/StorefrontController.php resources/views/shop/all-products.blade.php resources/views/shop/ecommerce/_styles.blade.php resources/views/layouts/navbar.blade.php routes/ecommerce.php
          git commit -m "Finish Encore storefront filters and ecommerce navigation" || true
          git rm .github/workflows/finish-encore-shop.yml
          git commit -m "Remove temporary shop workflow"
          git pull --rebase origin main
          git push origin main
