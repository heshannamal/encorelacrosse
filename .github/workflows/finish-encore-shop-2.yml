name: Finish Encore Shop 2

on:
  push:
    paths:
      - '.github/workflows/finish-encore-shop-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final shop patches
        shell: python
        run: |
          from pathlib import Path

          # Match the Alcatraz fallback filter behavior for Sport as well.
          p = Path('app/Services/Encore/ProductApiService.php')
          s = p.read_text()
          needle = '''        $selectedStyle = $filters['selectedStyle'] ?? null;\n'''
          sport = '''        $selectedSport = $filters['selectedSport'] ?? null;\n        if ($selectedSport && (string) $selectedSport !== '18') {\n            $sportIds = $this->relatedIds($item, [\n                'product_details.product_sport',\n                'productDetails.productSport',\n                'product_details.product_sports',\n                'productDetails.productSports',\n            ], ['sport_id', 'sport.id', 'id']);\n\n            // Encore treats sport 18 as All and includes it for every sport.\n            if ($sportIds && !in_array((int) $selectedSport, $sportIds, true) && !in_array(18, $sportIds, true)) {\n                return false;\n            }\n        }\n\n'''
          if sport not in s:
              s = s.replace(needle, sport + needle)
          p.write_text(s)

          # Main footer SHOP should open the dynamic store, not a single legacy category page.
          p = Path('resources/views/components/footer.blade.php')
          s = p.read_text().replace("{{ route('shop.mens-tops') }}\">Shop", "{{ route('allProduct') }}\">Shop")
          p.write_text(s)

          # Search icon should at least open the searchable storefront rather than a dead '#'.
          p = Path('resources/views/layouts/navbar.blade.php')
          s = p.read_text()
          s = s.replace('<a href="#" class="encore-tool" aria-label="Search"><i class="bi bi-search"></i></a>', '<a href="{{ route(\'allProduct\') }}" class="encore-tool" aria-label="Search products"><i class="bi bi-search"></i></a>')
          s = s.replace('<a href="#" aria-label="Search"><i class="bi bi-search"></i></a>', '<a href="{{ route(\'allProduct\') }}" aria-label="Search products"><i class="bi bi-search"></i></a>')
          p.write_text(s)

      - name: Syntax check and commit
        shell: bash
        run: |
          php -l app/Http/Controllers/StorefrontController.php
          php -l app/Services/Encore/ProductApiService.php
          php -l routes/ecommerce.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Encore/ProductApiService.php resources/views/components/footer.blade.php resources/views/layouts/navbar.blade.php
          git commit -m "Complete Encore shop filtering and navigation" || true
          git rm .github/workflows/finish-encore-shop-2.yml
          git commit -m "Remove temporary shop patch workflow"
          git pull --rebase origin main
          git push origin main
